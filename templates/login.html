<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMarket POS - Login</title>
    <!-- Google Fonts aur Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="brand-header">
            <div class="logo-box"><i class="fas fa-shopping-cart"></i></div>
            <h1>SuperMarket POS</h1>
            <p>Sign in to manage your branch operations</p>
        </div>
        <div class="login-card">
 <!-- Insert this between Line 19 and Line 20 -->
{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <div style="color: #ba1a1a; background: #ffdad6; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; font-weight: 600; border: 1px solid #ffb4ab;">
        <i class="fas fa-exclamation-circle"></i> {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
            <form action="/login_process" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-icon-wrapper">
                        <i class="far fa-user"></i>
                        <input type="text" name="username" placeholder="Enter your employee ID" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="label-row">
                        <label>Password</label>
                        <a href="#" class="forgot-link">Forgot?</a>
                    </div>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="••••••••" required>
                        <i class="far fa-eye toggle-eye"></i>
                    </div>
                </div>
                <div class="remember-row">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        Remember this device
                    </label>
                </div>
                <button type="submit" class="btn-primary-login">
                    Login <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
