<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMarket - Billing Counter</title>
    <!-- Standard fonts and icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dashboard-page">

    <div class="dashboard-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-shopping-basket"></i>
                <span>SuperMarket</span>
            </div>
            <nav class="nav-links">
                <a href="/dashboard" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/products" class="nav-item"><i class="fas fa-box"></i> Products</a>
                <a href="/billing" class="nav-item active"><i class="fas fa-calculator"></i> Billing Counter</a>
                <a href="#" class="nav-item"><i class="fas fa-history"></i> Sales History</a>
            </nav>
            <div class="sidebar-footer">
                <a href="/"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <header class="top-header">
                <h2>Billing Counter</h2>
                <div class="invoice-info">
                    <span>Invoice: <strong>#INV-2024-001</strong></span>
                </div>
            </header>

            <div class="billing-container">
                <!-- Left: Product Selection Area -->
                <div class="billing-left">
                    <div class="search-section">
                        <input type="text" placeholder="Scan barcode or type product name...">
                        <button class="btn-search"><i class="fas fa-search"></i></button>
                    </div>

                    <div class="quick-products-grid">
                        <!-- Example product cards for fast selection -->
                        <div class="p-card">
                            <p>Whole Milk</p>
                            <strong>$2.50</strong>
                        </div>
                        <div class="p-card">
                            <p>Fresh Bread</p>
                            <strong>$1.80</strong>
                        </div>
                        <div class="p-card">
                            <p>Apples 1kg</p>
                            <strong>$4.00</strong>
                        </div>
                    </div>
                </div>

                <!-- Right: Current Bill / Cart Area -->
                <div class="billing-right">
                    <div class="bill-card">
                        <h3>Current Bill</h3>
                        <table class="bill-table">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Whole Milk</td>
                                    <td>2</td>
                                    <td>$2.50</td>
                                    <td>$5.00</td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="bill-summary">
                            <div class="summary-row"><span>Subtotal:</span> <strong>$5.00</strong></div>
                            <div class="summary-row"><span>Tax (5%):</span> <strong>$0.25</strong></div>
                            <div class="summary-row grand-total"><span>Grand Total:</span> <strong>$5.25</strong></div>
                        </div>

                        <div class="bill-actions">
                            <button class="btn-print"><i class="fas fa-print"></i> Print Receipt</button>
                            <button class="btn-complete">Generate Bill <i class="fas fa-check"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
