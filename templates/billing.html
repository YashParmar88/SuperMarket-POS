<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMarket - Billing Counter</title>
    <!-- External fonts and icon libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Link to global stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dashboard-page">

    <div class="dashboard-wrapper">
        <!-- 1. Sidebar Section -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-shopping-basket"></i>
                <span>SuperMarket</span>
            </div>
            <nav class="nav-links">
                <a href="/dashboard" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/products" class="nav-item"><i class="fas fa-box"></i> Products</a>
                <a href="/billing" class="nav-item active"><i class="fas fa-calculator"></i> Billing Counter</a>
                <a href="/history" class="nav-item"><i class="fas fa-history"></i> Sales History</a>
            </nav>
            <div class="sidebar-footer">
                <a href="/logout" class="nav-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <!-- 2. Main Billing Workspace -->
        <main class="main-content">
            <header class="top-header">
                <h2>Billing Counter</h2>
                <span>Invoice: <strong>#INV-2024-001</strong></span>
            </header>

            <div class="billing-container">
                
                <!-- Left Section: Search and Product Selection -->
                <div class="selection-area">
                    <div class="search-section">
                        <input type="text" placeholder="Search products...">
                        <i class="fas fa-search" style="color: #94a3b8; padding-top: 10px;"></i>
                    </div>

                    <div class="quick-products-grid">
                        {% for item in products %}
                        <div class="p-card" onclick="addToBill('{{ item['name'] }}', {{ item['price'] }})">
                            <p><strong>{{ item['name'] }}</strong></p>
                            <span style="color: #003f87; font-weight: bold;">${{ item['price'] }}</span>
                            <br>
                            <small style="color: #64748b;">Stock: {{ item['stock'] }}</small>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- Right Section: Current Billing Summary -->
                <div class="bill-card">
                    <h3>Current Bill</h3>
                    <table class="bill-table">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th style="text-align: center;">Qty</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="bill-body"></tbody>
                    </table>

                    <div class="bill-summary">
                        <div class="summary-row"><span>Subtotal:</span> <strong id="subtotal">$0.00</strong></div>
                        <div class="summary-row"><span>Tax (5%):</span> <strong id="tax-amount">$0.00</strong></div>
                        <div class="summary-row grand-total"><span>Grand Total:</span> <strong id="grand-total">$0.00</strong></div>
                    </div>

                    <div class="bill-actions">
                        <button class="btn-print"><i class="fas fa-print"></i> Print Receipt</button>
                        <button class="btn-complete" onclick="generateBill()">Generate Bill <i class="fas fa-check"></i></button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- 3. Billing Logic Engine (JavaScript) -->
    <script>
        let cart = [];

        function addToBill(name, price) {
            let existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ name: name, price: price, qty: 1 });
            }
            updateBillUI();
        }

        function changeQty(name, amount) {
            let item = cart.find(i => i.name === name);
            if (item) {
                item.qty += amount;
                if (item.qty <= 0) removeFromCart(name);
            }
            updateBillUI();
        }

        function removeFromCart(name) {
            cart = cart.filter(i => i.name !== name);
            updateBillUI();
        }

        function updateBillUI() {
            const billBody = document.getElementById('bill-body');
            billBody.innerHTML = '';
            let subtotal = 0;

            cart.forEach((item) => {
                let itemTotal = item.price * item.qty;
                subtotal += itemTotal;
                billBody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td style="text-align: center;">
                            <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <button onclick="changeQty('${item.name}', -1)" style="cursor:pointer; width: 22px; height: 22px;">-</button>
                                <span>${item.qty}</span>
                                <button onclick="changeQty('${item.name}', 1)" style="cursor:pointer; width: 22px; height: 22px;">+</button>
                            </div>
                        </td>
                        <td>$${itemTotal.toFixed(2)}</td>
                        <td><i class="fas fa-trash-alt" style="color: #ba1a1a; cursor: pointer;" onclick="removeFromCart('${item.name}')"></i></td>
                    </tr>
                `;
            });

            let tax = subtotal * 0.05;
            let grandTotal = subtotal + tax;

            document.getElementById('subtotal').innerText = `$${subtotal.toFixed(2)}`;
            document.getElementById('tax-amount').innerText = `$${tax.toFixed(2)}`;
            document.getElementById('grand-total').innerText = `$${grandTotal.toFixed(2)}`;
        }

        // Updated Function to send FULL cart data to update stock
        function generateBill() {
            if (cart.length === 0) {
                alert("Your cart is empty! Please add products first.");
                return;
            }

            let totalText = document.getElementById('grand-total').innerText.replace('$', '');
            let totalValue = parseFloat(totalText);

            // Fetch request sending both Total and Cart Items
            fetch('/save_bill', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    total: totalValue, 
                    items: cart // Sending list of items to the backend for stock update
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("Success: " + data.message);
                    cart = []; 
                    updateBillUI(); 
                    // Refresh page to see updated stock numbers on cards
                    window.location.reload();
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Something went wrong while saving the bill.");
            });
        }
    </script>
</body>
</html>
