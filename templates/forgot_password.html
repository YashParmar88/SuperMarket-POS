<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - SuperMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="brand-header">
            <h1>Reset </h1>
            <p>Enter the Master Key to change password</p>
        </div>

        <div class="login-card">
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div style="color: #ba1a1a; background: #ffdad6; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 13px; font-weight: 600;">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/reset_password" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="admin or yash" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
                <div class="form-group">
                    <label>Master Secret Key</label>
                    <input type="password" name="secret_key" placeholder="Enter Owner's Key" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" placeholder="Create new password" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
                <button type="submit" class="btn-primary-login">Reset Password <i class="fas fa-key"></i></button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="/" style="color: #003f87; text-decoration: none; font-size: 13px;">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
